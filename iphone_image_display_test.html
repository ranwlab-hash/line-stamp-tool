<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone画像表示テスト</title><style>body{font-family:-apple-system,sans-serif;background:#f5f6fa;color:#222;margin:0;padding:20px}main{max-width:650px;margin:auto}.panel{background:white;border-radius:14px;padding:18px;margin:15px 0}input{max-width:100%}img{display:block;max-width:100%;height:auto;margin:12px auto;border:1px solid #ddd}#status{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:12px;border:0;border-radius:9px;background:#2464d5;color:white}canvas{max-width:100%;border:1px solid #ccc}</style></head><body><main><h2>画像表示だけのテスト</h2><p>まず「テスト画像を表示」を押してください。次に写真を選んでください。</p><div class="panel"><button id="sample">テスト画像を表示</button><p><label>画像を選択 <input type="file" id="file" accept="image/*"></label></p><div id="status" role="status">待機中</div></div><div class="panel"><b>画像プレビュー（img方式）</b><img id="preview" alt="ここに画像が表示されます"><b>画像プレビュー（canvas方式）</b><canvas id="canvas" width="300" height="180"></canvas></div></main><script>
(function(){const status=document.getElementById('status'),preview=document.getElementById('preview'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let objectUrl=null;function log(s){status.textContent=s;}function render(src,label){preview.onload=function(){log(label+'：画像表示成功 '+preview.naturalWidth+'×'+preview.naturalHeight);try{canvas.width=preview.naturalWidth;canvas.height=preview.naturalHeight;ctx.drawImage(preview,0,0);log(status.textContent+' / canvas描画成功');}catch(e){log(status.textContent+' / canvas失敗 '+e.message);}};preview.onerror=function(){log(label+'：画像読み込みエラー');};preview.src=src;}document.getElementById('sample').onclick=function(){if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}const svg='<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180"><rect width="400" height="180" fill="#d9f2e6"/><circle cx="75" cy="90" r="50" fill="#ffb55b"/><text x="150" y="105" font-size="34" fill="#222">表示テストOK</text></svg>';render('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),'テスト画像');};document.getElementById('file').onchange=function(e){const file=e.target.files&&e.target.files[0];if(!file){log('ファイル未選択');return;}log('選択：'+file.name+' / '+file.type+' / '+file.size+' bytes');if(objectUrl)URL.revokeObjectURL(objectUrl);try{objectUrl=URL.createObjectURL(file);render(objectUrl,'選択画像 '+file.name);}catch(err){log('ファイル読み込み失敗：'+err.message);}};})();
</script></body></html>
